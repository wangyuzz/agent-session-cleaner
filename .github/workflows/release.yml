name: Release

# A v-prefixed tag builds all four binaries and publishes a GitHub Release.
# A manual run builds without publishing, which makes it useful as a dry run.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing floating major-version tags after v7.
      - uses: astral-sh/setup-uv@v9.0.0

      - name: Lint
        run: uvx ruff check .

      # Install the package so packaging metadata is covered, but do not create
      # a uv.lock in the repository. Checks that need Codex skip themselves.
      - name: Test
        run: uv run --python 3.12 --no-project --with . tests/test_e2e.py

      # Fail before the platform builds if the hand-written tag, package
      # version, or release notes are missing or inconsistent.
      - name: Verify tag, version, and changelog
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c "import re, pathlib; \
            text = pathlib.Path('src/agent_session_cleaner/__init__.py').read_text(); \
            print(re.search(r'__version__ = \"([^\"]+)\"', text).group(1))")
          if [ "$tag" != "$version" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package version $version" >&2
            exit 1
          fi
          python3 scripts/changelog.py "$version" > /dev/null
          echo "Version $version and release notes are ready"

  macos:
    name: macOS ${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      # setup-uv stopped publishing floating major-version tags after v7.
      - uses: astral-sh/setup-uv@v9.0.0

      # The build script launches the binary and exercises the list, detail
      # pane, and q-to-quit path before accepting the artifact.
      - name: Build
        run: ./scripts/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: agent-session-cleaner-macos-${{ matrix.arch }}
          path: dist/agent-session-cleaner-macos-${{ matrix.arch }}
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # Use the repository Dockerfile exactly as a local buildx run would. Both
      # architectures build natively on matching runners, without emulation.
      - name: Build
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --target export \
            --output type=local,dest=dist \
            .

      - uses: actions/upload-artifact@v7
        with:
          name: agent-session-cleaner-linux-${{ matrix.arch }}
          path: dist/agent-session-cleaner-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: Publish release
    if: github.ref_type == 'tag'
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: agent-session-cleaner-*
          merge-multiple: true

      - name: Checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum agent-session-cleaner-* > checksums.txt
          cat checksums.txt

      # Release notes come directly from this version's changelog entry.
      - name: Prepare release notes
        run: |
          set -euo pipefail
          python3 scripts/changelog.py "$GITHUB_REF_NAME" > notes.md
          cat notes.md

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Hyphenated tags such as v0.4.1-rc1 are prereleases and do not
          # replace the latest stable release.
          case "$GITHUB_REF_NAME" in
            *-*) kind=(--prerelease) ;;
            *)   kind=(--latest) ;;
          esac
          # Asset filenames already describe their platforms; no display label
          # is needed.
          gh release create "$GITHUB_REF_NAME" \
            "${kind[@]}" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/*
