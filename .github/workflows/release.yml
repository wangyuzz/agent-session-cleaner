name: 发布

# 打一个 v 开头的标签就会构建四个平台的可执行文件并发到 Release 页面。
# 手动触发只构建、不发布，方便在动真格之前先看看能不能过。
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  check:
    name: 检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      # 完整版本号：setup-uv 从 v8 起就不再推 v8、v9 这样的浮动标签了。
      - uses: astral-sh/setup-uv@v9.0.0

      - name: 代码风格
        run: uvx ruff check .

      # --with . 把包真的装一遍，打包那节才有东西可查；--no-project 是为了
      # 不在仓库里留下一个 uv.lock。跑不到的部分（比如没装 codex）会自己跳过。
      - name: 测试
        run: uv run --python 3.12 --no-project --with . tests/test_e2e.py

      # 版本号只写在 __init__.py 里，标签是手打的，两者对不上就会发出一个
      # 自称是别的版本的包。这里拦住，总比发出去之后再撤要好。发布说明取自
      # CHANGELOG，缺了也在这里就报错，不必等四个平台都构建完才发现。
      - name: 标签、版本号和更新记录对得上
        if: github.ref_type == 'tag'
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          version=$(python3 -c "import re, pathlib; \
            text = pathlib.Path('src/agent_session_cleaner/__init__.py').read_text(); \
            print(re.search(r'__version__ = \"([^\"]+)\"', text).group(1))")
          if [ "$tag" != "$version" ]; then
            echo "标签 $GITHUB_REF_NAME 和代码里的版本号 $version 对不上" >&2
            exit 1
          fi
          python3 scripts/changelog.py "$version" > /dev/null
          # 花括号不能省：紧跟着的中文标点会被 bash 当成变量名的一部分。
          echo "版本号 ${version}，更新记录已就位"

  macos:
    name: macOS ${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x86_64
    steps:
      - uses: actions/checkout@v7
      # 完整版本号：setup-uv 从 v8 起就不再推 v8、v9 这样的浮动标签了。
      - uses: astral-sh/setup-uv@v9.0.0

      # 构建脚本自己会把产物拉起来跑一遍：列表、详情、按 q 退出。
      - name: 构建
        run: ./scripts/build.sh

      - uses: actions/upload-artifact@v7
        with:
          name: agent-session-cleaner-macos-${{ matrix.arch }}
          path: dist/agent-session-cleaner-macos-${{ matrix.arch }}
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    needs: check
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux/amd64
            arch: x86_64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
            arch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      # 跑的是仓库里那份 Dockerfile，和本地 docker buildx 的命令一模一样，
      # 所以在自己机器上验过的东西，这里不会变个样子。两种架构都用同架构的
      # 机器原生构建，不走模拟。
      - name: 构建
        run: |
          docker buildx build \
            --platform ${{ matrix.platform }} \
            --target export \
            --output type=local,dest=dist \
            .

      - uses: actions/upload-artifact@v7
        with:
          name: agent-session-cleaner-linux-${{ matrix.arch }}
          path: dist/agent-session-cleaner-linux-${{ matrix.arch }}
          if-no-files-found: error

  release:
    name: 发到 Release
    if: github.ref_type == 'tag'
    needs: [macos, linux]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: agent-session-cleaner-*
          merge-multiple: true

      - name: 校验和
        run: |
          set -euo pipefail
          cd dist
          sha256sum agent-session-cleaner-* > checksums.txt
          cat checksums.txt

      # 发布说明就是 CHANGELOG 里这一版写了什么，安装方法在 README 里，
      # 不在每次发布时重复一遍。
      - name: 写发布说明
        run: |
          set -euo pipefail
          python3 scripts/changelog.py "$GITHUB_REF_NAME" > notes.md
          cat notes.md

      - name: 建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # 带横杠的标签（v0.4.0-rc1 之类）当预发布，不会顶掉 latest。
          case "$GITHUB_REF_NAME" in
            *-*) kind=(--prerelease) ;;
            *)   kind=(--latest) ;;
          esac
          # 资产不加显示名，页面上直接就是文件名——文件名本身已经说明了平台。
          gh release create "$GITHUB_REF_NAME" \
            "${kind[@]}" \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            dist/*
